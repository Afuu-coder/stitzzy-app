runConfig:
  # Next.js ke liye minimum 512MB RAM recommended
  memoryMiB: 512
  cpu: 1
  minInstances: 0
  maxInstances: 10
  concurrency: 80

env:
  # App URL — production pe update karo
  - variable: NEXT_PUBLIC_APP_URL
    value: https://stitzzy--stitzzy-app.us-central1.hosted.app
    availability:
      - BUILD
      - RUNTIME

  # Firebase Client SDK (public)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyDAAWGbCjN7yAiFvJ_mHmgrT-0G1vaesEw"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "stitzzy.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "stitzzy"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "stitzzy.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "753115900011"
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:753115900011:web:18f21239f990857682e92e"
    availability:
      - BUILD
      - RUNTIME

  # Firebase Admin SDK (server only)
  - variable: FIREBASE_ADMIN_PROJECT_ID
    secret: FIREBASE_ADMIN_PROJECT_ID

  - variable: FIREBASE_ADMIN_CLIENT_EMAIL
    secret: FIREBASE_ADMIN_CLIENT_EMAIL

  - variable: FIREBASE_ADMIN_PRIVATE_KEY
    secret: FIREBASE_ADMIN_PRIVATE_KEY

  # Clerk Auth
  - variable: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    secret: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
    availability:
      - BUILD
      - RUNTIME

  - variable: CLERK_SECRET_KEY
    secret: CLERK_SECRET_KEY

  - variable: NEXT_PUBLIC_CLERK_SIGN_IN_URL
    value: /sign-in
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_SIGN_UP_URL
    value: /sign-up
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_AFTER_SIGN_IN_URL
    value: /
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_CLERK_AFTER_SIGN_UP_URL
    value: /
    availability:
      - BUILD
      - RUNTIME

  # WhatsApp
  - variable: NEXT_PUBLIC_WHATSAPP_NUMBER
    value: "918473083827"
    availability:
      - BUILD
      - RUNTIME
